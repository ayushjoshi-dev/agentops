# Alembic configuration file
# 
# This is the main configuration file for Alembic migrations.
# Run migrations from the backend/ directory:
#   alembic upgrade head

[alembic]
# Path to migration scripts
script_location = alembic

# Migration file naming convention
# Includes timestamp for unique ordering
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Database URL — overridden in env.py from settings.DATABASE_URL
# This is a placeholder — don't put real credentials here!
sqlalchemy.url = postgresql://user:pass@localhost/agentops

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
